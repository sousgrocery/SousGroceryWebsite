<html>
    <head>
        <title>Sous Grocery</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <div class="parallax parallax-header">
            <img src="Group 29.svg" alt="Sous Grocery Logo" class="page-logo">
            <div class="navigation">
                <a href="#screenshots" data-scroll>Screenshots</a> | 
                <a href="#privacy-policy" data-scroll>Privacy Policy</a>
            </div>
        </div>
        <section id="screenshots" class="screenshots">
            <h2>App Screenshots</h2>
            <div class="screenshot-grid">
                <img src="static/screenshots/screenshot2.jpeg" alt="Screenshot 2">
                <img src="static/screenshots/screenshot3.jpeg" alt="Screenshot 3">
                <img src="static/screenshots/screenshot4.jpeg" alt="Screenshot 4">
            </div>
        </section>
        <section id="privacy-policy" class="content">
            <div>
                <h2>Privacy Policy</h2>
                <p>Sous Grocery collects your email so that you can make an account and sign in and out.
                    The data within the app is saved on Sous Grocery's servers and is tied to your account.
                </p>
            </div>
        </section>
        <footer class="footer">
            &copy; 2025 Sous Grocery LLC
        </footer>
        <script src="script.js"></script>
    </body>
</html>
